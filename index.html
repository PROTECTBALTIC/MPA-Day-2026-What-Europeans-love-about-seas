<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>What People Love About European Seas</title>
<style>

@font-face {
    font-family: 'EarlyMan';
    src: url('EarlyMan.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
}
  
html,body{
margin:0;height:100%;overflow:hidden;
font-family:Segoe UI,sans-serif;background:#02131f;
}
.hero{position:relative;height:100vh;overflow:hidden;}
.slide{
position:absolute;inset:0;
background-size:cover;
background-position:center;
opacity:0;
animation:crossfade 72s infinite;
}
.slide:nth-child(1){animation-delay:0s;background-image:url('MPA Day 2026-14.png');}
.slide:nth-child(2){animation-delay:8s;background-image:url('MPA Day 2026-15.png');}
.slide:nth-child(3){animation-delay:16s;background-image:url('MPA Day 2026-16.png');}
.slide:nth-child(4){animation-delay:24s;background-image:url('MPA Day 2026-17.png');}
.slide:nth-child(5){animation-delay:32s;background-image:url('MPA Day 2026-18.png');}
.slide:nth-child(6){animation-delay:40s;background-image:url('MPA Day 2026-19.png');}
.slide:nth-child(7){animation-delay:48s;background-image:url('MPA Day 2026-20.png');}
.slide:nth-child(8){animation-delay:56s;background-image:url('MPA Day 2026-21.png');}
.slide:nth-child(9){animation-delay:64s;background-image:url('MPA Day 2026-22.png');}
  
@keyframes crossfade{
0%,28%{opacity:1;transform:scale(1);}
33%,100%{opacity:0;transform:scale(1.08);}
}

.overlay{
position:absolute;inset:0;
background:linear-gradient(to bottom,rgba(0,0,0,.1),rgba(2,19,31,.7));
}


.logoContainer{
position:absolute;
top:calc(4% + 0px);
left:50%;
transform:translateX(-50%);
width:min(1200px,85vw);
height:900px;
overflow:hidden;
z-index:5;
}

.logo{

position:absolute;
top:calc(4% - 100px);
left:50%;
transform:translateX(-50%);
width:min(1200px,85vw);
top:0px;
width:100%;
filter:drop-shadow(0 10px 30px rgba(0,0,0,.35));
}

.cards{
position:absolute;
bottom:40px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:25px;
width:min(1200px,90vw);
justify-content:center;
flex-wrap:wrap;
z-index:5;
}

.card{
width:320px;
padding:24px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(14px);
border-radius:24px;
color:white;
border:1px solid rgba(255,255,255,.2);
}

.card h3{
font-family:'EarlyMan', sans-serif;
text-align:center;
font-size:34px;
font-weight:normal;
margin-top:0;
margin-bottom:16px;
}

.card p{
text-align:center;
}

.cardLink{
text-decoration:none;
color:inherit;
display:block;
}

.cardLink:hover .card{
transform:translateY(-6px);
transition:0.3s;
cursor:pointer;
}
    
.stat{
position:absolute;
top:70%;
left:50%;
transform:translateX(-50%);
color:white;
font-size:28px;
font-weight:600;
z-index:5;
}


@media (max-width: 1024px){
  html,body{
    overflow:auto;
    height:auto;
  }

  .hero{
    min-height:100vh;
    height:auto;
  }

  .logoContainer{
    position:relative;
    top:auto;
    left:auto;
    transform:none;
    width:90vw;
    height:auto;
    margin:20px auto 0;
  }

  .logo{
    position:relative;
    width:100%;
    top:auto;
    left:auto;
    transform:none;
  }

  .stat{
    position:relative;
    top:auto;
    left:auto;
    transform:none;
    text-align:center;
    margin:10px auto 20px;
    width:90%;
    font-size:22px;
  }

  .cards{
    position:relative;
    bottom:auto;
    left:auto;
    transform:none;
    width:92vw;
    margin:20px auto 40px;
    gap:16px;
  }

  .card{
    width:min(100%,420px);
    padding:20px;
  }

  .card h3{
    font-size:28px;
  }
}

@media (max-width: 600px){
  .card{
    width:100%;
    box-sizing:border-box;
  }

  .card h3{
    font-size:24px;
  }

  .card p{
    font-size:15px;
  }

  .stat{
    font-size:18px;
  }
}


@media (max-width: 1024px){
  .cards{
    display:flex !important;
    flex-direction:column !important;
    align-items:center !important;
  }

  .cardLink{
    width:100% !important;
    max-width:420px !important;
    display:block !important;
  }

  .card{
    width:100% !important;
    max-width:420px !important;
    box-sizing:border-box !important;
  }
}

</style>

<style id="responsive-laptop-index-fix">
/* Compact laptop / shallow landscape screens */
@media (max-width: 900px) and (orientation: landscape),
       (max-height: 760px) and (min-width: 650px){
  html,body{
    height:100%;
    overflow:hidden !important;
  }

  .hero{
    height:100vh !important;
    min-height:0 !important;
    overflow:hidden !important;
  }

  .logoContainer{
    position:absolute !important;
    top:18px !important;
    left:50% !important;
    transform:translateX(-50%) !important;
    width:min(620px,58vw) !important;
    height:auto !important;
    margin:0 !important;
    z-index:5 !important;
  }

  .logo{
    position:relative !important;
    top:auto !important;
    left:auto !important;
    transform:none !important;
    width:100% !important;
  }

  .stat{
    position:absolute !important;
    top:52vh !important;
    left:50% !important;
    transform:translateX(-50%) !important;
    width:92vw !important;
    margin:0 !important;
    text-align:center !important;
    font-size:clamp(17px,2.4vw,23px) !important;
    line-height:1.2 !important;
    z-index:6 !important;
  }

  .cards{
    position:absolute !important;
    left:50% !important;
    bottom:18px !important;
    transform:translateX(-50%) !important;
    width:96vw !important;
    display:flex !important;
    flex-direction:row !important;
    flex-wrap:nowrap !important;
    gap:12px !important;
    justify-content:center !important;
    align-items:stretch !important;
    margin:0 !important;
    z-index:7 !important;
  }

  .cardLink{
    flex:1 1 0 !important;
    max-width:230px !important;
    min-width:0 !important;
    width:auto !important;
  }

  .card{
    width:100% !important;
    max-width:none !important;
    height:100% !important;
    padding:14px 12px !important;
    border-radius:18px !important;
    box-sizing:border-box !important;
  }

  .card h3{
    font-size:clamp(18px,2.7vw,25px) !important;
    line-height:1.05 !important;
    margin-bottom:8px !important;
  }

  .card p{
    font-size:clamp(12px,1.65vw,14px) !important;
    line-height:1.25 !important;
    margin:0 !important;
  }
}

/* Normal tablet/mobile portrait layout */
@media (max-width: 900px) and (orientation: portrait){
  html,body{
    overflow:auto !important;
    height:auto !important;
  }

  .hero{
    min-height:100vh !important;
    height:auto !important;
    overflow:hidden !important;
    padding-bottom:28px !important;
  }

  .logoContainer{
    position:relative !important;
    top:auto !important;
    left:auto !important;
    transform:none !important;
    width:92vw !important;
    max-width:620px !important;
    height:auto !important;
    margin:20px auto 0 !important;
  }

  .logo{
    position:relative !important;
    width:100% !important;
    top:auto !important;
    left:auto !important;
    transform:none !important;
  }

  .stat{
    position:relative !important;
    top:auto !important;
    left:auto !important;
    transform:none !important;
    width:90vw !important;
    margin:10px auto 18px !important;
    text-align:center !important;
    font-size:clamp(18px,5vw,24px) !important;
  }

  .cards{
    position:relative !important;
    left:auto !important;
    bottom:auto !important;
    transform:none !important;
    width:92vw !important;
    margin:12px auto 36px !important;
    display:flex !important;
    flex-direction:column !important;
    gap:14px !important;
    align-items:center !important;
  }

  .cardLink{
    width:100% !important;
    max-width:430px !important;
  }

  .card{
    width:100% !important;
    max-width:none !important;
    box-sizing:border-box !important;
  }
}

/* Very small phones */
@media (max-width: 420px){
  .logoContainer{
    width:96vw !important;
    margin-top:14px !important;
  }

  .stat{
    font-size:17px !important;
    margin-bottom:14px !important;
  }

  .card{
    padding:17px !important;
    border-radius:20px !important;
  }

  .card h3{
    font-size:23px !important;
    line-height:1.08 !important;
  }

  .card p{
    font-size:14px !important;
    line-height:1.35 !important;
  }
}
</style>

</head>
<body>

<div class="hero">
<div class="slide"></div>
<div class="slide"></div>
<div class="slide"></div>
<div class="slide"></div>
<div class="slide"></div>
<div class="slide"></div>
<div class="slide"></div>
<div class="slide"></div>
<div class="slide"></div>

<div class="logoContainer"><img class="logo" src="logo_survey.png"></div>

<div class="stat" id="stat">191 people shared their views</div>

<div class="cards">

<div class="card">

<p>Explore responses across Europe, demographics and sea-basin participation.</p>
</div>

<a href="values_sea.html" class="cardLink">
<div class="card">

<p>Discover what people value most about Europe's seas.</p>
</div>
</a>

<a href="what-should-mpas-do.html" class="cardLink">
<div class="card">
<h3>What Should MPAs Do?</h3>
<p>Explore the interactive word cloud and sea-basin insights.</p>
</div>
</a>
</div>
</div>

<script>
const msgs=[
"Ocean protection needs human connection",
"191 people shared their views",
"6 European sea basins represented",
"3,191 words analysed",
"86 % of respondents know what an MPA is"
];

let i=0;
setInterval(()=>{
i=(i+1)%msgs.length;
document.getElementById('stat').textContent=msgs[i];
},4000);
</script>

</body>
</html>
