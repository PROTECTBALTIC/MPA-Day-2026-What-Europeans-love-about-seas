 if(view==='rank' || view==='agerank'){
   insightsPanel.style.display='none';
   viz.style.height='auto';
 }else{
   insightsPanel.style.display='grid';
   viz.style.height='900px';
   viz.innerHTML='';
 }

 let d=DATA[basin];
 resp.innerHTML='<b>'+d.n+'</b>';
 if(view==='bottom'){
   metricText.innerHTML='Bottom-3 respondent percentage';
   metricInfo.title='% of respondents placing a value in ranks 8-10';
 } else {
   metricText.innerHTML='Top-3 respondent percentage';
   metricInfo.title='% of respondents placing a value in ranks 1-3';
 }

 top3.innerHTML=d.top_ranked.slice(0,3).map((x,i)=>`${i+1}. ${x[0]} (${x[1]}%)`).join('<br>');
 bottom3.innerHTML=d.bottom_ranked.slice(0,3).map((x,i)=>`${i+1}. ${x[0]} (${x[1]}%)`).join('<br>');
 Plotly.purge('viz');
 if(basin==='All responses'){
   metricText.innerHTML='Viewing the European-wide baseline used for comparison.';
 } else {
   const allresponsesTop = DATA["All responses"].top_ranked.reduce((a,x)=>{a[x[0]]=x[1];return a;},{});
   const allresponsesBottom = DATA["All responses"].bottom_ranked.reduce((a,x)=>{a[x[0]]=x[1];return a;},{});

   if(view==='bottom'){
      let diffs=d.bottom_ranked.map(x=>({name:x[0],diff:Math.round((x[1]-allresponsesBottom[x[0]])*10)/10}));
      let pos=[...diffs].sort((a,b)=>b.diff-a.diff)[0];
      let neg=[...diffs].sort((a,b)=>a.diff-b.diff)[0];
      metricText.innerHTML=`<div style="color:#7BC67B;font-weight:bold">▲ ${pos.name}<br>+${pos.diff}% vs Europe</div><br>
      <div style="color:#E57373;font-weight:bold">▼ ${neg.name}<br>${neg.diff}% vs Europe</div><br>
      <div>Most distinctive Bottom-3 differences.</div>`;
   } else {
      let diffs=d.top_ranked.map(x=>({name:x[0],diff:Math.round((x[1]-allresponsesTop[x[0]])*10)/10}));
      let pos=[...diffs].sort((a,b)=>b.diff-a.diff)[0];
      let neg=[...diffs].sort((a,b)=>a.diff-b.diff)[0];
      metricText.innerHTML=`<div style="color:#7BC67B;font-weight:bold">▲ ${pos.name}<br>+${pos.diff}% vs Europe</div><br>
      <div style="color:#E57373;font-weight:bold">▼ ${neg.name}<br>${neg.diff}% vs Europe</div><br>
      <div>Most distinctive Top-3 differences.</div>`;
   }
 }

 if(view==='heat'){
 Plotly.newPlot('viz',[{type:'heatmap',z:d.heat,y:(isMobile()?MOBILE_CATS:CATS),x:RANKS,hovertemplate:'%{x}<br>%{y}<br>%{z}% of respondents<extra></extra>',
 colorscale:[[0,'#08243c'],[0.5,'#14aae2'],[1,'#c7d54f']]}],
 {xaxis:{side:'top',tickangle:-35},yaxis:{autorange:'reversed'},paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{color:'white'},margin:{l:isMobile()?120:320,r:20,t:isMobile()?70:90,b:40}},{responsive:true});
 } else if(view==='bar') {
 Plotly.newPlot('viz',[{type:'bar',orientation:'h',y:d.top_ranked.slice(0,10).map(x=>x[0]).reverse(),x:d.top_ranked.slice(0,10).map(x=>x[1]).reverse(),
 marker:{color:'#14aae2'},hovertemplate:'%{x}% of respondents placed this value in ranks 1-3<extra></extra>'}],
 {xaxis:{title:'% of respondents placing value in Top 3'},paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{color:'white'},margin:{l:isMobile()?120:320,r:20,t:30,b:isMobile()?60:100}},{responsive:true});
 } else if(view==='bottom') {
 Plotly.newPlot('viz',[{type:'bar',orientation:'h',y:d.bottom_ranked.slice(0,10).map(x=>x[0]).reverse(),x:d.bottom_ranked.slice(0,10).map(x=>x[1]).reverse(),
 marker:{color:'#c7d54f'},hovertemplate:'%{x}% of respondents placed this value in ranks 8-10<extra></extra>'}],
 {xaxis:{title:'% of respondents placing value in Bottom 3'},paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{color:'white'},margin:{l:isMobile()?120:320,r:20,t:30,b:isMobile()?60:100}},{responsive:true});
 
 } else if(view==='agerank') {
   Plotly.purge('viz');
   const ages=['Under 18','18-24','25-34','35-44','45-54','55-64','65-74'];
   let html='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;color:white;font-size:15px"><thead><tr><th style="padding:10px;text-align:left">Value</th>';
   ages.forEach(a=>{if(AGE_RANKINGS[a]) html+=`<th style="padding:10px">${a}<br><span style="font-weight:normal">n=${AGE_RANKINGS[a].n}</span></th>`});
   html+='</tr></thead><tbody>';
   CATS.forEach(cat=>{
      html+=`<tr style="border-top:1px solid rgba(255,255,255,.15)"><td style="padding:10px;font-weight:600">${cat}</td>`;
      ages.forEach(a=>{
        if(!AGE_RANKINGS[a]) return;
        const rank=AGE_RANKINGS[a].ranking.findIndex(x=>x[0]===cat)+1;
        let bg=rank<=3?'background:rgba(76,175,80,.35);':(rank>=8?'background:rgba(244,67,54,.30);':'background:rgba(255,255,255,.05);');
        html+=`<td style="${bg};padding:10px;text-align:center">#${rank}</td>`;
      });
      html+='</tr>';
   });
   html+='</tbody></table></div>';

   html+=`<details open style="margin-top:20px;padding:18px;background:#0a2238;border-radius:12px;line-height:1.55">
   <summary style="font-size:20px;font-weight:bold;cursor:pointer">What do different generations value?</summary>
   <div style="margin-top:12px">

   
<p><strong>Biodiversity is the highest-ranked value in every adult age group.</strong><br>
Across all age groups from 18–24 upwards, biodiversity remains the clear top priority, suggesting broad agreement that healthy ecosystems underpin many of the benefits people receive from the sea.</p>

<p><strong>18–24 year olds place strong emphasis on nature and climate.</strong><br>
This group gives particularly high rankings to biodiversity and climate regulation, indicating a strong environmental focus.</p>

<p><strong>25–34 year olds are the most nature-focused generation in the survey.</strong><br>
Biodiversity receives its highest support in this age group, while climate regulation remains firmly in second place.</p>

<p><strong>35–44 year olds balance environmental and recreational benefits.</strong><br>
Alongside biodiversity and climate regulation, recreation and scenery rank particularly highly, reflecting the importance of spending time by and on the sea.</p>

<p><strong>45–54 year olds place the greatest emphasis on identity and heritage.</strong><br>
Local identity and cultural heritage rank higher in this age group than in any other, highlighting the importance of long-standing personal and community connections to the coast.</p>

<p><strong>55–64 year olds show a balanced mix of priorities.</strong><br>
Biodiversity, climate regulation and recreation dominate, but food provided by the sea also ranks relatively highly compared with younger age groups.</p>

<p><strong>65–74 year olds place unusually high value on practical benefits.</strong><br>
Coastal protection, food provision and renewable energy all rank more highly in this group than in most others, suggesting a stronger focus on the sea's tangible contributions to society.</p>

<p><em>Note: The Under 18 category contains only two responses and should be interpreted with caution.</em></p>


   </div></details>`;

   document.getElementById('viz').innerHTML=html;

} else if(view==='rank') {

 if(basin==='All responses'){

   const basins=['All responses','Atlantic Ocean','Baltic Sea','Black Sea','East Mediterranean Sea','North Sea','West Mediterranean Sea'];

   const shortNames={
     'All responses':'Europe',
     'Baltic Sea':'Baltic',
     'North Sea':'North Sea',
     'Atlantic Ocean':'Atlantic',
     'Black Sea':'Black Sea',
     'East Mediterranean Sea':'East Med',
     'West Mediterranean Sea':'West Med'
   };

   let html='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;color:white;font-size:15px">';
   html+='<thead><tr><th style="padding:10px;text-align:left">Value</th>';

   basins.forEach(b=>{
      html+=`<th style="padding:10px;text-align:center">${shortNames[b]}</th>`;
   });

   html+='</tr></thead><tbody>';

   CATS.forEach(cat=>{

      html+=`<tr style="border-top:1px solid rgba(255,255,255,.15)"><td style="padding:10px;font-weight:600">${cat}</td>`;

      basins.forEach(b=>{
          const rank=DATA[b].top_ranked.findIndex(x=>x[0]===cat)+1;

          let bg='';
          if(rank<=3) bg='background:rgba(76,175,80,.35);';
          else if(rank>=8) bg='background:rgba(244,67,54,.30);';
          else bg='background:rgba(255,255,255,.05);';

          html+=`<td style="padding:10px;text-align:center;${bg}">#${rank}</td>`;
      });

      html+='</tr>';
   });

   html+='</tbody></table>';

   html+=`<details open style="margin-top:20px;padding:18px;background:#0a2238;border-radius:12px;line-height:1.55"><summary style="font-size:20px;font-weight:bold;cursor:pointer">What makes each sea unique?</summary><div style="margin-top:12px">
   <h3 style="margin-top:0">Key patterns across Europe's seas</h3>

   <p><strong>Biodiversity comes first everywhere.</strong><br>
   Across every sea basin, biodiversity and healthy marine habitats emerge as the highest priority. Despite regional differences, respondents consistently place the protection of nature above all other benefits provided by the sea.</p>

   <p><strong>Atlantic respondents emphasise global environmental benefits.</strong><br>
   Climate regulation is particularly prominent among Atlantic respondents, suggesting a stronger focus on the sea's role in regulating climate and supporting wider environmental systems.</p>

   <p><strong>The Baltic Sea stands out for everyday connections to the sea.</strong><br>
   Recreation and scenery rank particularly highly around the Baltic Sea. Swimming, boating, spending time by the coast and enjoying familiar seascapes appear especially important, reflecting the sea's close connection to daily life.</p>

   <p><strong>The Black Sea prioritises protection from coastal hazards.</strong><br>
   Coastal protection ranks far higher around the Black Sea than in any other basin. Respondents appear especially conscious of the role healthy marine ecosystems can play in reducing erosion, buffering storms and protecting coastal communities.</p>

   <p><strong>The Eastern Mediterranean places greater emphasis on the sea's environmental benefits.</strong><br>
   Alongside biodiversity, respondents rank climate regulation and coastal protection particularly highly. Compared with other regions, there is a stronger focus on the sea's role in supporting healthy ecosystems, storing carbon and protecting coastal communities from environmental change.</p>

   <p><strong>The North Sea shows a stronger focus on climate and energy.</strong><br>
   Climate regulation ranks highly across Europe, but North Sea respondents also place unusually high importance on renewable energy compared with other sea basins.</p>

   <p><strong>The Western Mediterranean reflects a strong connection between people and place.</strong><br>
   Recreation and scenery rank unusually highly, highlighting the importance of beaches, coastal landscapes and time spent by the sea. While biodiversity remains the top priority, respondents place particular value on the experiences and quality of life that healthy marine environments provide.</p>

   <p><strong>Some values are consistently lower priorities.</strong><br>
   Across almost all sea basins, recreational fishing and renewable energy appear among the lowest-ranked values. This does not mean they are unimportant, but they are generally outweighed by biodiversity, recreation, climate benefits and coastal protection.</p>

   </div>`;

   document.getElementById('viz').innerHTML=html;

 } else {

   const rankings=d.top_ranked.map((x,i)=>({rank:i+1,value:x[0],pct:x[1]}));
   let html='<div style="max-width:900px;margin:auto;"><table style="width:100%;border-collapse:collapse;color:white;font-size:16px"><thead><tr><th style="text-align:left;padding:12px;">Rank</th><th style="text-align:left;padding:12px;">Value</th><th style="text-align:right;padding:12px;">Top 3 (%)</th></tr></thead><tbody>';
   rankings.forEach(r=>{
     html+=`<tr style="border-top:1px solid rgba(255,255,255,.15)"><td style="padding:12px;font-weight:bold">#${r.rank}</td><td style="padding:12px">${r.value}</td><td style="padding:12px;text-align:right">${r.pct}%</td></tr>`;
   });
   html+='</tbody></table></div>';
   document.getElementById('viz').innerHTML=html;
 }

 }
}
render();
</script></body></html>
