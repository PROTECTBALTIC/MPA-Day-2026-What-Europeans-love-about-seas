<style id="earlyman-font-face-final">

<style>
html,body{
margin:0;
overflow:hidden;
background:radial-gradient(circle at top,#35c6ff 0%,#083b5c 45%,#02131f 100%);
font-family:Arial,sans-serif;
}

canvas{display:block;}

#panel{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:620px;
padding:20px;
border-radius:22px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(10px);
color:white;
z-index:10;
max-height:85vh;
overflow:auto;
}



#mpaLogo{
position:absolute;
top:24px;
right:28px;
width:70px;
opacity:.92;
pointer-events:none;
z-index:20;
}


#title{
font-size:42px;
text-align:center;
font-family:"Early Man","Impact","Arial Black",sans-serif;
letter-spacing:1px;
font-weight:900;
margin-bottom:18px;
}

#selected{
font-size:34px;
text-align:center;
color:#ffe082;
}



.animatedQuote{
opacity:0;
animation:quoteFade 4.8s ease forwards;
min-height:72px;
}

@keyframes quoteFade{
0%{
opacity:0;
transform:translateY(8px);
}
12%{
opacity:1;
transform:translateY(0);
}
78%{
opacity:1;
}
100%{
opacity:1;
transform:translateY(0);
}
}


.quote{
margin-top:10px;
padding-left:10px;
border-left:2px solid rgba(255,255,255,.22);
font-size:18px;
line-height:1.7;
font-style:italic;
font-weight:500;
}

#basinSelector{
position:absolute;
right:20px;
bottom:20px;
z-index:50;
background:rgba(255,255,255,.08);
backdrop-filter:blur(10px);
padding:12px;
border-radius:18px;
}

#basinSelector button{
background:rgba(255,255,255,.12);
color:white;
border:1px solid rgba(255,255,255,.15);
border-radius:999px;
padding:8px 14px;
margin:4px;
cursor:pointer;
transition:all .25s ease;
}

#basinSelector button:hover{
background:rgba(255,255,255,.22);
transform:translateY(-2px);
}

#basinSelector button.active{
transform:translateY(-2px) scale(1.08);

background:rgba(255,224,130,.95);
color:#00334d;
font-weight:bold;
box-shadow:0 0 18px rgba(255,224,130,.6);
}

#basinName{
color:#ffe082;
font-size:20px;
text-align:center;
margin-top:8px;
}


#seaBasinTitle{
position:absolute;top:18px;left:50%;transform:translateX(-50%);
z-index:45;font-family:"Early Man","Impact","Arial Black",sans-serif;
font-size:56px;font-weight:900;letter-spacing:2px;text-transform:uppercase;
pointer-events:none;transition:all .45s ease;color:#ffffff;text-align:center;
text-shadow:0 0 15px rgba(255,255,255,.25);
}

.back-btn{
  position:absolute;
  left:20px;
  top:20px;
  padding:10px 18px;
  border-radius:999px;
  text-decoration:none;
  color:white;

  font-family:Arial,sans-serif;
  font-weight:700;
  font-size:18px;
  letter-spacing:0;
  text-transform:none;

  background:#004470;
  border:1px solid rgba(255,255,255,.18);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    0 2px 8px rgba(0,0,0,.25);
  cursor:pointer;
  z-index:100;
}


@media (max-width:900px){
html,body{
  overflow:auto;
}

#seaBasinTitle{
  font-size:32px;
  top:12px;
}

#panel{
  width:min(92vw,620px);
  top:52%;
  left:50%;
  transform:translate(-50%,-50%);
}

#title{font-size:30px;}
#selected{font-size:24px;}

#basinSelector{
  position:static;
  width:100%;
  max-width:none;
  margin:30px auto 20px auto;
  text-align:center;
  background:transparent;
  white-space:nowrap;
  overflow-x:auto;
  overflow-y:hidden;
}

#basinSelector button{
  display:inline-flex;
  font-size:12px;
  padding:6px 10px;
  margin:2px;
}

canvas{
  margin-top:0;
  display:block;
}
body{padding-bottom:420px;}
}

function drawTurtle(tu,t){

ctx.save();

ctx.translate(tu.x,tu.y);

ctx.rotate(0.05);

ctx.fillStyle="rgba(120,220,180,.16)";

// shell
ctx.beginPath();
ctx.ellipse(0,0,tu.size,tu.size*0.72,0,0,Math.PI*2);
ctx.fill();

// head
ctx.beginPath();
ctx.arc(tu.size*1.0,0,tu.size*0.18,0,Math.PI*2);
ctx.fill();

// front flippers
const flap = 0.35;

ctx.beginPath();
ctx.ellipse(
tu.size*0.32,
-tu.size*0.52,
tu.size*0.18,
tu.size*0.45,
-flap,
0,
Math.PI*2
);
ctx.fill();

ctx.beginPath();
ctx.ellipse(
tu.size*0.32,
tu.size*0.52,
tu.size*0.18,
tu.size*0.45,
flap,
0,
Math.PI*2
);
ctx.fill();

// rear flippers
ctx.beginPath();
ctx.ellipse(
-tu.size*0.85,
-tu.size*0.35,
tu.size*0.12,
tu.size*0.25,
-0.5,
0,
Math.PI*2
);
ctx.fill();

ctx.beginPath();
ctx.ellipse(
-tu.size*0.85,
tu.size*0.35,
tu.size*0.12,
tu.size*0.25,
0.5,
0,
Math.PI*2
);
ctx.fill();

ctx.restore();
}



let quoteInterval = null;

function renderQuotes(word){

const q=document.getElementById("quotes");

const quotes = currentQuoteMap[word] || [];

q.innerHTML="";

if(quoteInterval){
clearInterval(quoteInterval);
}

if(!quotes.length){
return;
}

let current = 0;

function showQuote(){

q.innerHTML = "";

const d=document.createElement("div");
d.className="quote animatedQuote";

const highlighted = quotes[current].replace(
new RegExp(word,"gi"),
match=>`<span style="color:#ffd54f;font-weight:900;text-shadow:0 0 8px rgba(255,213,79,0.65);">${match}</span>`
);

d.innerHTML="“"+highlighted+"”";


q.appendChild(d);

current = (current + 1) % quotes.length;

}

showQuote();

if(quotes.length > 1){
quoteInterval = setInterval(showQuote, 4800);
}

}

function drawFish(f,t){
ctx.save();

ctx.translate(f.x,f.y);

const swim=Math.sin(t*0.003+f.phase);
ctx.rotate(swim*0.12);

const g=ctx.createLinearGradient(-f.size,0,f.size,0);
g.addColorStop(0,"rgba(120,220,255,0.04)");
g.addColorStop(.5,"rgba(160,240,255,0.18)");
g.addColorStop(1,"rgba(120,220,255,0.04)");

ctx.fillStyle=g;

ctx.beginPath();
ctx.moveTo(f.size,0);

ctx.bezierCurveTo(
f.size*.2,-f.size*.35,
-f.size*.7,-f.size*.28,
-f.size,0
);

ctx.bezierCurveTo(
-f.size*.7,f.size*.28,
f.size*.2,f.size*.35,
f.size,0
);

ctx.fill();

ctx.save();
ctx.translate(-f.size,0);
ctx.rotate(Math.sin(t*.006+f.phase)*.4);

ctx.beginPath();
ctx.moveTo(0,0);
ctx.lineTo(-f.size*.7,-f.size*.4);
ctx.lineTo(-f.size*.45,0);
ctx.lineTo(-f.size*.7,f.size*.4);
ctx.closePath();
ctx.fill();

ctx.restore();
ctx.restore();
}



// seagrass background
function drawSeagrassField(t){

ctx.save();

for(let i=0;i<34;i++){

const baseX = (i/33) * canvas.width;
const height = 50 + ((i * 17) % 70);

ctx.strokeStyle = "rgba(80,180,120,0.14)";


ctx.lineWidth =
(i % 7 === 0) ? 7 :
(i % 5 === 0) ? 5 :
(i % 3 === 0) ? 3.5 :
2;



ctx.beginPath();
ctx.moveTo(baseX, canvas.height + 10);

for(let y=0;y>-height;y-=10){

const sway =
Math.sin((t*0.0015)+(i*0.7)+(y*0.03)) * 6;

ctx.lineTo(baseX + sway, canvas.height + y);

}


ctx.stroke();

// extra dense patches
if(i % 6 === 0){

ctx.beginPath();
ctx.moveTo(baseX + 6, canvas.height + 10);

for(let y=0;y>-height*0.9;y-=10){

const sway =
Math.sin((t*0.0018)+(i*0.9)+(y*0.03)) * 8;

ctx.lineTo(baseX + 6 + sway, canvas.height + y);

}

ctx.stroke();

}


}

ctx.restore();

}

if (window.innerWidth <= 768) {

function switchDataset(name){
    const ds = basinDatasets[name];
    if(!ds) return;
    currentQuoteMap = ds.quoteMap || {};
    buildWordCloud(ds);

    }

}

<script id="v5_robust_responsive_html_words">
(function(){
  let selectedWord = null;

  function ensureLayer(){
    let layer=document.getElementById('htmlWordLayer');
    if(!layer){
      layer=document.createElement('div');
      layer.id='htmlWordLayer';
      const canvas=document.getElementById('c');
      if(canvas && canvas.parentNode){
        canvas.parentNode.insertBefore(layer, canvas.nextSibling);
      }else{
        document.body.appendChild(layer);
      }
    }
    return layer;
  }

  function rankedWords(){
    if(typeof words==='undefined') return [];
    return words.slice().sort((a,b)=>(b.count||0)-(a.count||0));
  }

  function getSize(w){
    const list=rankedWords();
    const counts=list.map(x=>x.count||0);
    const min=Math.min.apply(null, counts.length?counts:[0]);
    const max=Math.max.apply(null, counts.length?counts:[1]);
    const scale=((w.count||0)-min)/Math.max(1,max-min);
    const mobile=window.innerWidth<=768;
    const compact=window.innerHeight<=850 && window.innerWidth>768;

    if(mobile){
      return Math.round(15 + scale*13); // one-column mobile list
    }
    if(compact){
      return Math.round(18 + scale*26); // laptop landscape, no crowding
    }
    return Math.round(22 + scale*42); // full desktop/monitor
  }

  function selectWord(text){
    selectedWord=text;
    if(typeof words!=='undefined'){
      words.forEach(w=>w.selected=((w.text||'')===text));
    }
    const match=(typeof words!=='undefined') ? words.find(w=>(w.text||'')===text) : null;
    const selected=document.getElementById('selected');
    const count=document.getElementById('count');
    if(selected) selected.innerText=text;
    if(count && match) count.innerText=(match.count||0)+' mentions';
    if(typeof renderQuotes==='function') renderQuotes(text);
    updateActiveButtons();
  }

  function updateActiveButtons(){
    document.querySelectorAll('.html-word').forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.word===selectedWord);
    });
  }

  function suppressCanvasWords(){
    if(typeof words==='undefined') return;
    words.forEach(w=>{
      if(w._realSize===undefined || w._realSize<1) w._realSize=getSize(w);
      w.size=0.01;
      w.homeX=-9999;
      w.homeY=-9999;
      w.x=-9999;
      w.y=-9999;
    });
  }

  function renderHtmlWords(){
    const layer=ensureLayer();
    const list=rankedWords();
    layer.innerHTML='';

    list.forEach(w=>{
      const btn=document.createElement('button');
      btn.type='button';
      btn.className='html-word';
      btn.dataset.word=w.text;
      btn.textContent=w.text;
      const size=getSize(w);
      btn.style.setProperty('--word-size', size+'px');
      btn.style.setProperty('--mobile-word-size', Math.min(size,28)+'px');
      btn.addEventListener('click', function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        selectWord(w.text);
      });
      layer.appendChild(btn);
    });

    suppressCanvasWords();
    updateActiveButtons();
    updateMobileHeight();
  }

  function updateMobileHeight(){
    if(window.innerWidth>768){
      document.body.style.minHeight='';
      const canvas=document.getElementById('c');
      if(canvas){ canvas.style.height=window.innerHeight+'px'; }
      return;
    }

    const panel=document.getElementById('panel');
    const layer=ensureLayer();
    const panelBottom=panel ? (panel.offsetTop + panel.offsetHeight) : 300;
    const top=panelBottom + 28;
    document.documentElement.style.setProperty('--mobile-word-top', top+'px');
    const h=Math.max(window.innerHeight, top + layer.scrollHeight + 135);
    document.body.style.minHeight=h+'px';
    const canvas=document.getElementById('c');
    if(canvas){
      canvas.height=h;
      canvas.style.height=h+'px';
    }
  }

  const oldBuild=window.buildWordCloud || (typeof buildWordCloud!=='undefined' ? buildWordCloud : null);
  if(oldBuild){
    window.buildWordCloud=function(ds){
      oldBuild(ds);
      selectedWord=null;
      setTimeout(renderHtmlWords,0);
      setTimeout(renderHtmlWords,80);
    };
    try{ buildWordCloud=window.buildWordCloud; }catch(e){}
  }

  const oldSwitch=window.switchDataset || (typeof switchDataset!=='undefined' ? switchDataset : null);
  if(oldSwitch){
    window.switchDataset=function(name){
      oldSwitch(name);
      selectedWord=null;
      setTimeout(renderHtmlWords,0);
      setTimeout(renderHtmlWords,100);
    };
    try{ switchDataset=window.switchDataset; }catch(e){}
  }

  const oldApply=window.applyFixedCloudLayout;
  window.applyFixedCloudLayout=function(){
    if(oldApply) oldApply();
    suppressCanvasWords();
    updateMobileHeight();
  };

  window.addEventListener('resize', function(){
    setTimeout(renderHtmlWords,80);
  });
  window.addEventListener('load', function(){
    setTimeout(renderHtmlWords,120);
    setTimeout(renderHtmlWords,450);
  });
  setTimeout(renderHtmlWords,200);
})();
</script>

<script id="v14_wordle_engine">
(function(){

/*
  V16 layout refinement.
  Keeps the approved safe six-row desktop layout, but assigns larger / more
  mentioned terms to central slots and smaller terms to the periphery.
  On mobile, words are stacked in one centred column for readability.
*/
function buildWordlePositions(n){
  // Safe 6 rows x 4 columns box. The central slots are deliberately staggered
  // so the largest words are central without sitting too close together.
  const grid={
    topLeft:      [-0.48,-0.52], topMidLeft:   [-0.16,-0.52], topMidRight:  [0.18,-0.52], topRight:     [0.50,-0.52],
    upperLeft:    [-0.34,-0.31], upperMidLeft: [-0.08,-0.31], upperMidRight:[0.26,-0.31], upperRight:   [0.54,-0.31],
    centreLeft:   [-0.46,-0.10], centreMidLeft:[-0.20,-0.10], centreMidRight:[0.22,-0.10], centreRight:  [0.50,-0.10],
    lowerLeft:    [-0.34, 0.11], lowerMidLeft: [-0.04, 0.11], lowerMidRight:[0.34, 0.11], lowerRight:   [0.56, 0.11],
    bottomLeft:   [-0.48, 0.32], bottomMidLeft:[-0.16, 0.32], bottomMidRight:[0.18, 0.32], bottomRight:  [0.50, 0.32],
    baseLeft:     [-0.34, 0.53], baseMidLeft:  [-0.04, 0.53], baseMidRight: [0.34, 0.53], baseRight:    [0.56, 0.53]
  };

  // Centre-first order, but staggered across neighbouring rows. This keeps
  // protect / ecosystem / biodiversity central while improving spacing.
  const centreFirst=[
    grid.centreMidLeft, grid.lowerMidRight, grid.upperMidRight, grid.lowerMidLeft,
    grid.centreRight, grid.upperMidLeft, grid.bottomMidRight, grid.bottomMidLeft,
    grid.centreLeft, grid.upperRight, grid.lowerRight, grid.upperLeft,
    grid.lowerLeft, grid.bottomRight, grid.bottomLeft, grid.topMidRight,
    grid.topMidLeft, grid.baseMidRight, grid.baseMidLeft, grid.topRight,
    grid.topLeft, grid.baseRight, grid.baseLeft, grid.centreMidRight
  ];

  return centreFirst.slice(0,n);
}

window.applyFixedCloudLayout=function(){
  if(typeof words==='undefined') return;

  const isMobile=window.innerWidth < 768;

  // Always assign positions by mention count so the most important words are central.
  const ranked=words.slice().sort((a,b)=>(b.count||0)-(a.count||0));

  if(isMobile){
    const panel=document.getElementById('panel');
    const panelTop=72;
    const panelHeight=panel ? panel.offsetHeight : 220;
    const wordStart=panelTop + panelHeight + 52;
    const gap=38;
    const bottomReserve=120;
    const desiredHeight=Math.max(window.innerHeight, wordStart + ranked.length*gap + bottomReserve);

    canvas.width=window.innerWidth;
    canvas.height=desiredHeight;
    canvas.style.height=desiredHeight+'px';
    document.body.style.minHeight=desiredHeight+'px';

    const centerX=window.innerWidth*0.50;

    ranked.forEach((w,i)=>{
      w.homeX=centerX;
      w.homeY=wordStart + i*gap;
      w.x=w.homeX;
      w.y=w.homeY;
    });
    return;
  }

  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  canvas.style.height=window.innerHeight+'px';
  document.body.style.minHeight='';

  const pts=buildWordlePositions(ranked.length);

  // Desktop: cloud remains in the safe left content area with clear separation
  // from the quote panel on the right.
  const centerX=window.innerWidth*0.34;
  const centerY=window.innerHeight*0.50;
  const spreadX=window.innerWidth*0.36;
  const spreadY=window.innerHeight*0.58;

  ranked.forEach((w,i)=>{
    const p=pts[i % pts.length];
    w.homeX=centerX + p[0]*spreadX;
    w.homeY=centerY + p[1]*spreadY;
    w.x=w.homeX;
    w.y=w.homeY;
  });
};

setTimeout(()=>{
  if(window.applyFixedCloudLayout) window.applyFixedCloudLayout();
},100);

window.addEventListener('resize',()=>{
  if(window.applyFixedCloudLayout) window.applyFixedCloudLayout();
});

// Keep positions locked to the layout during animation.
const _raf = window.requestAnimationFrame;
window.requestAnimationFrame = function(fn){
  return _raf(function(t){
    if(typeof words!=='undefined'){
      words.forEach(w=>{
        if(w.homeX!==undefined){
          w.x=w.homeX;
          w.y=w.homeY;
        }
      });
    }
    fn(t);
  });
};

// Re-apply after basin changes or word clicks.
document.addEventListener('click',()=>{
  setTimeout(()=>{
    if(window.applyFixedCloudLayout) window.applyFixedCloudLayout();
  },50);
});

function scrollMobilePanelIntoView(){
  if(window.innerWidth >= 768) return;
  const panel=document.getElementById('panel');
  if(!panel) return;
  setTimeout(()=>{
    panel.scrollIntoView({behavior:'smooth', block:'start'});
    setTimeout(()=>{ if(window.applyFixedCloudLayout) window.applyFixedCloudLayout(); },180);
  },80);
}

const activeCanvas=document.getElementById('c');
if(activeCanvas){
  activeCanvas.addEventListener('click', scrollMobilePanelIntoView);
  activeCanvas.addEventListener('touchend', scrollMobilePanelIntoView, {passive:true});
}

})();
</script>


<script id="v15_all_responses_and_quotes_fix">
(function(){
  /*
    Fixes two remaining V15 issues without changing the approved layout:
    1) Restores the true All Responses word list and quote map after a basin click.
    2) Fills missing All Responses quote entries, for example education/monitoring/tourism,
       by merging quotes already present in the basin datasets.
  */

  if(typeof basinDatasets === 'undefined' || typeof wordsData === 'undefined' || typeof quoteMap === 'undefined') return;

  const allResponsesWordsData = wordsData.map(row => Array.isArray(row) ? row.slice() : row);

  function addUnique(target, item){
    if(!item) return;
    if(target.indexOf(item) === -1) target.push(item);
  }

  function buildMergedAllQuoteMap(){
    const merged = {};

    // Start with the original all-response quote map.
    Object.keys(quoteMap).forEach(word => {
      merged[word] = Array.isArray(quoteMap[word]) ? quoteMap[word].slice() : [];
    });

    // Then add any matching quotes already available inside sea-basin datasets.
    Object.keys(basinDatasets).forEach(name => {
      if(name === 'All Responses') return;
      const ds = basinDatasets[name];
      if(!ds || !ds.quoteMap) return;
      Object.keys(ds.quoteMap).forEach(word => {
        if(!merged[word]) merged[word] = [];
        (ds.quoteMap[word] || []).forEach(q => addUnique(merged[word], q));
      });
    });

    return merged;
  }

  const mergedAllQuoteMap = buildMergedAllQuoteMap();

  // Mutate the existing const quoteMap object so older render logic still sees the same reference.
  Object.keys(mergedAllQuoteMap).forEach(word => {
    quoteMap[word] = mergedAllQuoteMap[word];
  });

  basinDatasets['All Responses'] = {
    wordsData: allResponsesWordsData,
    quoteMap: quoteMap
  };

  const previousSwitchDataset = window.switchDataset || switchDataset;

  window.switchDataset = function(name){
    const targetName = (name === 'All' || name === 'All responses') ? 'All Responses' : name;

    if(targetName === 'All Responses'){
      currentQuoteMap = quoteMap;
      if(typeof buildWordCloud === 'function'){
        buildWordCloud(basinDatasets['All Responses']);
      } else if(previousSwitchDataset){
        previousSwitchDataset(targetName);
      }
    } else if(previousSwitchDataset){
      previousSwitchDataset(targetName);
    }

    if(targetName !== 'All Responses'){
      const ds = basinDatasets[targetName];
      if(ds && ds.quoteMap) currentQuoteMap = ds.quoteMap;
    } else {
      currentQuoteMap = quoteMap;
    }

    if(typeof words !== 'undefined'){
      words.forEach(w => w.selected = false);
    }

    const selected = document.getElementById('selected');
    const count = document.getElementById('count');
    const quotes = document.getElementById('quotes');
    if(selected) selected.innerText = 'Click a word';
    if(count) count.innerText = '';
    if(quotes) quotes.innerHTML = '';

    if(typeof quoteInterval !== 'undefined' && quoteInterval){
      clearInterval(quoteInterval);
      quoteInterval = null;
    }

    const title = document.getElementById('seaBasinTitle');
    if(title){
      title.textContent = targetName.toUpperCase();
      title.style.color = '#ffffff';
      title.style.opacity = '1';
      title.style.transform = 'translateX(-50%) scale(1)';
    }

    if(typeof applyFixedCloudLayout === 'function'){
      setTimeout(applyFixedCloudLayout, 0);
      setTimeout(applyFixedCloudLayout, 60);
    }

    const basinColours={
      'All Responses':'#0075bf',
      'Baltic Sea':'#14aae2',
      'North Sea':'#00ab97',
      'Atlantic Ocean':'#83d0f5',
      'West Mediterranean Sea':'#008e5c',
      'East Mediterranean Sea':'#c7d641',
      'Black Sea':'#4eb051'
    };

    document.querySelectorAll('#basinSelector button').forEach(btn=>{
      const txt=btn.textContent.trim();
      btn.classList.remove('active');
      btn.style.background='rgba(255,255,255,.12)';
      btn.style.color='white';
      btn.style.boxShadow='none';
      if(txt === targetName || (targetName === 'All Responses' && (txt === 'All' || txt === 'All Responses'))){
        const c = basinColours[targetName] || '#0075bf';
        btn.classList.add('active');
        btn.style.background = c;
        btn.style.color = targetName === 'East Mediterranean Sea' ? '#00334d' : '#ffffff';
        btn.style.boxShadow = '0 0 20px ' + c;
      }
    });
  };

  // Make sure the first view also uses the complete all-response quote map.
  currentQuoteMap = quoteMap;
})();
</script>


<script id="v20_clean_final_positioning">
(function(){
  /*
    Clean final positioning layer.
    Replaces the previous manual nudges with a consistent, collision-aware layout:
    - high-frequency terms sit near the centre of the cloud area;
    - smaller terms move towards the edges;
    - the cloud stays inside the safe area between the left edge and quote panel;
    - mobile remains a single-column list below the quote panel.
  */

  function getBasin(){
    const title=document.getElementById('seaBasinTitle');
    const raw=(title?title.textContent:'ALL RESPONSES').trim().toUpperCase();
    return ({
      'ALL RESPONSES':'All Responses',
      'ATLANTIC OCEAN':'Atlantic Ocean',
      'BALTIC SEA':'Baltic Sea',
      'BLACK SEA':'Black Sea',
      'EAST MEDITERRANEAN SEA':'East Mediterranean Sea',
      'NORTH SEA':'North Sea',
      'WEST MEDITERRANEAN SEA':'West Mediterranean Sea'
    })[raw] || raw;
  }

  function findWord(name){
    if(typeof words==='undefined') return null;
    return words.find(w => (w.text||'').toLowerCase() === name.toLowerCase()) || null;
  }

  function wordWidth(w){
    if(!w || typeof ctx==='undefined') return 100;
    ctx.font=`bold ${w.size}px Arial`;
    return Math.max(ctx.measureText(w.text).width, w.size * 2.2);
  }

  function bounds(w, pad){
    const ww=wordWidth(w);
    const hh=Math.max(w.size*1.25, 34);
    return {
      left:w.homeX-ww/2-pad,
      right:w.homeX+ww/2+pad,
      top:w.homeY-hh/2-pad,
      bottom:w.homeY+hh/2+pad,
      w:ww,
      h:hh
    };
  }

  function overlaps(a,b,pad){
    const A=bounds(a,pad), B=bounds(b,pad);
    return !(A.right < B.left || A.left > B.right || A.bottom < B.top || A.top > B.bottom);
  }

  function clampWord(w, safe){
    const ww=wordWidth(w);
    w.homeX=Math.max(safe.left+ww/2, Math.min(safe.right-ww/2, w.homeX));
    w.homeY=Math.max(safe.top+w.size, Math.min(safe.bottom-w.size, w.homeY));
    w.x=w.homeX; w.y=w.homeY;
  }

  function setRightOf(targetName, anchorName, safe, pad){
    const target=findWord(targetName), anchor=findWord(anchorName);
    if(!target || !anchor) return;
    const gap=pad||42;
    target.homeY=anchor.homeY;
    target.homeX=anchor.homeX + wordWidth(anchor)/2 + wordWidth(target)/2 + gap;
    clampWord(target, safe);
  }

  function move(name, dx, dy, safe){
    const w=findWord(name); if(!w) return;
    w.homeX += dx||0; w.homeY += dy||0;
    clampWord(w, safe);
  }

  function moveGroup(names, dx, dy, safe){
    names.forEach(n=>move(n,dx,dy,safe));
  }

  function swap(aName,bName){
    const a=findWord(aName), b=findWord(bName);
    if(!a || !b) return;
    const ax=a.homeX, ay=a.homeY;
    a.homeX=b.homeX; a.homeY=b.homeY;
    b.homeX=ax; b.homeY=ay;
    a.x=a.homeX; a.y=a.homeY; b.x=b.homeX; b.y=b.homeY;
  }

  function relaxCollisions(safe){
    if(typeof words==='undefined') return;
    const ranked=words.slice().sort((a,b)=>(b.count||0)-(a.count||0));
    const pad=18;
    for(let iter=0; iter<18; iter++){
      let changed=false;
      for(let i=0;i<ranked.length;i++){
        for(let j=i+1;j<ranked.length;j++){
          const a=ranked[i], b=ranked[j];
          if(!overlaps(a,b,pad)) continue;
          changed=true;
          const smaller=(a.count||0) <= (b.count||0) ? a : b;
          const larger=smaller===a ? b : a;
          let dx=smaller.homeX-larger.homeX;
          let dy=smaller.homeY-larger.homeY;
          if(Math.abs(dx)<1 && Math.abs(dy)<1){ dx = (j%2?1:-1); dy = (i%2?1:-1); }
          const horizontal = Math.abs(dx) >= Math.abs(dy)*0.65;
          if(horizontal){
            smaller.homeX += (dx>=0?1:-1) * 18;
          }else{
            smaller.homeY += (dy>=0?1:-1) * 16;
          }
          clampWord(smaller, safe);
        }
      }
      if(!changed) break;
    }
  }

  function applyCleanDesktopLayout(){
    if(typeof words==='undefined' || !words.length) return;

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
    canvas.style.height=window.innerHeight+'px';
    document.body.style.minHeight='';

    const panel=document.getElementById('panel');
    const panelLeft=panel ? panel.getBoundingClientRect().left : window.innerWidth*0.70;
    const safe={
      left: Math.max(90, window.innerWidth*0.045),
      right: Math.min(window.innerWidth*0.68, panelLeft-90),
      top: Math.max(100, window.innerHeight*0.14),
      bottom: Math.max(window.innerHeight-95, window.innerHeight*0.82)
    };
    if(safe.right-safe.left < 430){
      safe.left=70;
      safe.right=Math.max(500, window.innerWidth*0.62);
    }

    const cx=(safe.left+safe.right)/2;
    const cy=(safe.top+safe.bottom)/2;
    const sx=(safe.right-safe.left)/2;
    const sy=(safe.bottom-safe.top)/2;

    const slots=[
      [-0.30,-0.08],[0.34,-0.08],[0.02,-0.36],[-0.58,0.08],[0.62,0.10],
      [-0.54,-0.30],[-0.10,0.18],[0.22,0.34],[-0.40,0.36],[0.54,-0.32],
      [-0.16,-0.58],[0.30,-0.58],[-0.60,0.48],[0.60,0.48],[-0.64,-0.06],
      [-0.28,0.62],[0.06,0.62],[0.42,0.62],[-0.50,-0.60],[0.62,-0.58],
      [-0.70,0.28],[0.70,0.28],[-0.72,-0.42],[0.74,-0.08],[-0.02,0.48]
    ];

    const ranked=words.slice().sort((a,b)=>(b.count||0)-(a.count||0));
    ranked.forEach((w,i)=>{
      const p=slots[i % slots.length];
      w.homeX=cx + p[0]*sx;
      w.homeY=cy + p[1]*sy;
      clampWord(w,safe);
    });

    const basin=getBasin();

    // Keep the user's intended basin-specific relationships, but apply them as
    // clean slot relationships rather than one-off accumulated nudges.
    if(basin==='All Responses'){
      swap('ecosystem','overfishing');
    }
    if(basin==='Atlantic Ocean' || basin==='Baltic Sea'){
      setRightOf('ecosystem','protect',safe,46);
    }
    if(basin==='Black Sea'){
      move('ecosystem',-40,0,safe);
      move('protect',80,0,safe);
    }
    if(basin==='East Mediterranean Sea'){
      setRightOf('ecosystem','fish',safe,46);
    }
    if(basin==='North Sea'){
      move('protect',80,0,safe);
      moveGroup(['species','ecosystem','climate'],-80,0,safe);
    }
    if(basin==='West Mediterranean Sea'){
      move('protect',80,0,safe);
      moveGroup(['biodiversity','human','sustainable'],-80,0,safe);
    }

    // Final deterministic collision pass for all basins.
    words.forEach(w=>clampWord(w,safe));
    relaxCollisions(safe);
    words.forEach(w=>{ w.x=w.homeX; w.y=w.homeY; });
  }

  function applyCleanMobileLayout(){
    const ranked=words.slice().sort((a,b)=>(b.count||0)-(a.count||0));
    const panel=document.getElementById('panel');
    const panelTop=72;
    const panelHeight=panel ? panel.offsetHeight : 220;
    const wordStart=panelTop + panelHeight + 44;
    const gap=40;
    const bottomReserve=72;
    const lastWordY=wordStart + Math.max(0, ranked.length-1)*gap;
    const desiredHeight=Math.max(window.innerHeight, lastWordY + bottomReserve);

    canvas.width=window.innerWidth;
    canvas.height=desiredHeight;
    canvas.style.height=desiredHeight+'px';
    document.body.style.minHeight=desiredHeight+'px';

    ranked.forEach((w,i)=>{
      w.homeX=window.innerWidth*0.50;
      w.homeY=wordStart + i*gap;
      w.x=w.homeX; w.y=w.homeY;
    });
  }

  window.applyFixedCloudLayout=function(){
    if(typeof words==='undefined') return;
    if(window.innerWidth < 768) applyCleanMobileLayout();
    else applyCleanDesktopLayout();
  };

  setTimeout(()=>window.applyFixedCloudLayout(),80);
  setTimeout(()=>window.applyFixedCloudLayout(),220);
  window.addEventListener('resize',()=>setTimeout(()=>window.applyFixedCloudLayout(),60));
})();
</script>
